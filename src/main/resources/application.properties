spring.application.name=security

# --- H2 in-memory database (development) ---
spring.datasource.url=jdbc:h2:mem:securitydb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console (dev only)
spring.h2.console.enabled=true

# --- JWT (development default) ---
# HS256 requires a key of at least 256 bits (32 bytes). In production, load this from an
# environment variable / secret manager and prefer asymmetric keys (RS256). Never commit real secrets.
jwt.secret=${JWT_SECRET:dev-only-super-secret-key-change-me-32b!}

# --- Brute-force lockout ---
security.lockout.max-attempts=3
security.lockout.duration-minutes=15

# --- Do not leak stack traces in error responses (this is also the Boot default) ---
server.error.include-stacktrace=never
server.error.include-message=never
